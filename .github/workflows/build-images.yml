# Gera e publica as imagens de contêiner (multi-arquitetura) no GitHub Container Registry
name: Build de imagens

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["src/gateway/**", "src/multiagente/**", "src/chatbot/**", "src/vision/**", "src/iot/**", ".github/workflows/build-images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    name: ${{ matrix.imagem }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {imagem: cardioia-gateway, contexto: src/gateway}
          - {imagem: cardioia-multiagente, contexto: src/multiagente}
          - {imagem: cardioia-chatbot, contexto: src/chatbot}
          - {imagem: cardioia-vision, contexto: src/vision}
          - {imagem: cardioia-iot-simulador, contexto: src/iot}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.imagem }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.imagem }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagem }}
