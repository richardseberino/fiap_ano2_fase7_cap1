# Sistema multiagente (OpenAI Agents SDK + Random Forest). 1 réplica: análises ficam em memória p/ perguntas de acompanhamento.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multiagente
  labels: {app: multiagente, tier: app}
spec:
  replicas: 1
  selector: {matchLabels: {app: multiagente}}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  template:
    metadata: {labels: {app: multiagente, tier: app}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: multiagente
          image: cardioia-multiagente
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8001}]
          env:
            - name: OPENAI_API_KEY
              valueFrom: {secretKeyRef: {name: cardioia-secrets, key: OPENAI_API_KEY, optional: true}}
            - name: OPENAI_MODEL
              valueFrom: {secretKeyRef: {name: cardioia-secrets, key: OPENAI_MODEL, optional: true}}
          volumeMounts: [{name: historico, mountPath: /var/lib/multiagente}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          startupProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 20, periodSeconds: 5, failureThreshold: 36}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 20, failureThreshold: 3}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 1Gi}
      volumes: [{name: historico, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: multiagente
  labels: {app: multiagente}
spec:
  selector: {app: multiagente}
  ports: [{name: http, port: 8001, targetPort: http}]
