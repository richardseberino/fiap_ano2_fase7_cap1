# Coletor MQTT -> InfluxDB (substitui o Node-RED configurado manualmente)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf
  labels: {app: telegraf, tier: infra}
spec:
  replicas: 1
  selector: {matchLabels: {app: telegraf}}
  template:
    metadata: {labels: {app: telegraf, tier: infra}}
    spec:
      containers:
        - name: telegraf
          image: telegraf:1.34-alpine
          envFrom:
            - configMapRef: {name: cardioia-config}
            - secretRef: {name: cardioia-secrets}
          volumeMounts:
            - {name: config, mountPath: /etc/telegraf/telegraf.conf, subPath: telegraf.conf}
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {memory: 256Mi}
      volumes:
        - {name: config, configMap: {name: telegraf-config}}
