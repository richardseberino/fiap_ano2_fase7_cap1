# Telegraf: MQTT (Mosquitto) -> InfluxDB 2.x
# Substitui o fluxo manual do Node-RED da fase anterior por configuração declarativa,
# versionada e reproduzível em container/Kubernetes.
[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  # tópico local (simulador/dispositivos na rede) e tópico trazido pelo bridge do Wokwi
  topics = ["cardioia/sinais-vitais/+", "fiap-drell/cardioia/sinais-vitais/+"]
  qos = 1
  connection_timeout = "30s"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "sinais_vitais"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "paciente_id"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "setor"
      optional = true
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "dispositivo"
      optional = true
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "origem"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "bpm"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "oxigenacao"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temperatura"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pa_sistolica"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "nivel_alerta"
      type = "int"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "panico"
      type = "int"
      optional = true
