# Mosquitto (broker MQTT) da plataforma CardioIA
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# MQTT para dispositivos (ESP32 / Pico W / simulador) e Telegraf
listener 1883
allow_anonymous true

# MQTT sobre WebSockets (dashboards web e testes)
listener 9001
protocol websockets

# ---------------------------------------------------------------------------
# Bridge com o broker público usado pelo Wokwi web.
# O simulador Wokwi (rede Wokwi-GUEST) não alcança o cluster diretamente; ele
# publica em broker.hivemq.com e este bridge traz as mensagens para cá.
# Em produção, troque por um listener TLS exposto (8883) com autenticação.
# ---------------------------------------------------------------------------
connection wokwi-bridge
address broker.hivemq.com:1883
topic fiap-drell/cardioia/sinais-vitais/# in 1
cleansession true
try_private false
start_type automatic
restart_timeout 10 60
